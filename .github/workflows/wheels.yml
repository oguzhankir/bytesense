name: Build and test distributions
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    env:
      BYTESENSE_BUILD_RUST: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine pytest hypothesis
      - run: python -m build
      - run: twine check --strict dist/*
      - run: python scripts/check_dist.py dist
      - run: python -m pip install dist/*.whl
      - run: python -m pytest tests -o pythonpath= -q
      - name: Source install without a compiler
        run: |
          python -m pip uninstall -y bytesense
          python -m pip install --no-cache-dir dist/*.tar.gz
          python -m pytest tests -o pythonpath= -q
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-portable
          path: dist/*
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, arch: x86_64}
          - {os: ubuntu-24.04-arm, arch: aarch64}
          - {os: macos-15-intel, arch: x86_64, macos_target: '10.12'}
          - {os: macos-latest, arch: arm64, macos_target: '11.0'}
          - {os: windows-latest, arch: AMD64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: pypa/cibuildwheel@v4.2.1
        env:
          # Match wheel repair's target to the Rust standard library minimum.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target || '11.0' }}
          CIBW_BUILD: 'cp39-*'
          CIBW_SKIP: '*-musllinux*'
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT: 'BYTESENSE_BUILD_RUST=1 BYTESENSE_EXPECT_RUST=1'
          CIBW_ENVIRONMENT_LINUX: 'BYTESENSE_BUILD_RUST=1 BYTESENSE_EXPECT_RUST=1 PATH="$HOME/.cargo/bin:$PATH"'
          CIBW_BEFORE_ALL_LINUX: 'curl --proto =https --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal'
          CIBW_TEST_REQUIRES: 'pytest hypothesis'
          CIBW_TEST_COMMAND: 'python -m pytest {project}/tests -o pythonpath= -q'
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
  abi3-newest-python:
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, artifact: distribution-ubuntu-latest-x86_64}
          - {os: macos-latest, artifact: distribution-macos-latest-arm64}
          - {os: windows-latest, artifact: distribution-windows-latest-AMD64}
    runs-on: ${{ matrix.os }}
    env:
      BYTESENSE_EXPECT_RUST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse
      - run: python -m pip install pytest hypothesis
      - run: python -m pip install --no-index --find-links=wheelhouse bytesense
      - run: python -m pytest tests -o pythonpath= -q
