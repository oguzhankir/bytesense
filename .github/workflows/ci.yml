name: CI
on:
  push:
    branches: [main, 'oguzhankir/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pure:
    name: Pure Python · ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.12', '3.14']
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: ubuntu-latest, python: 'pypy3.10'}
    env:
      BYTESENSE_BUILD_RUST: '0'
      BYTESENSE_PURE_PYTHON: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Current Hypothesis native builds require PyPy 3.11; keep the pure
      # Hypothesis release for the supported PyPy 3.10 runtime checks.
      - run: python -m pip install . pytest "${{ matrix.python == 'pypy3.10' && 'hypothesis==6.100.0' || 'hypothesis' }}"
      - run: python -c "from bytesense._rust import is_rust_available; assert not is_rust_available()"
      # Disable the source path override so tests exercise the installed artifact.
      - run: python -m pytest tests -o pythonpath= -q
  native:
    name: Native · ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.14']
    env:
      BYTESENSE_BUILD_RUST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: python -m pip install . pytest hypothesis
      - run: python -c "from bytesense._rust import is_rust_available; assert is_rust_available()"
      - run: python -m pytest tests -o pythonpath= -q
      - run: cargo test --manifest-path rust/Cargo.toml --locked
      - name: Rust formatting and lint
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: |
          cargo fmt --manifest-path rust/Cargo.toml --check
          cargo clippy --manifest-path rust/Cargo.toml --locked -- -D warnings
  quality:
    runs-on: ubuntu-latest
    env:
      BYTESENSE_BUILD_RUST: '0'
      BYTESENSE_PURE_PYTHON: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,docs]'
      - run: python scripts/check_version.py
      - run: ruff check src tests benchmarks scripts setup.py
      - run: mypy src/bytesense
      - run: python -m pytest tests --cov=bytesense --cov-branch --cov-report=xml
      - run: python scripts/fetch_cn_benchmark_samples.py
      - run: python -m pytest benchmarks/test_bench_detection.py benchmarks/test_hard_scenarios.py --benchmark-disable
      - run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
  evaluation:
    name: Frozen accuracy and backend parity
    runs-on: ubuntu-latest
    env:
      BYTESENSE_BUILD_RUST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: python -m pip install . chardet==7.6.0 charset-normalizer==3.5.1 chardetng-py==0.3.5
      - run: python -c "from bytesense._rust import is_rust_available; assert is_rust_available()"
      - name: Fetch exact evaluation sources
        run: |
          git init corpus
          git -C corpus fetch --depth 1 https://github.com/chardet/test-data b0c0d206913ba118ffea2f7d306883e7a4a76db7
          git -C corpus checkout --detach FETCH_HEAD
          git init udhr
          git -C udhr fetch --depth 1 https://github.com/unicode-org/udhr 588b3f4b2d0467aff54842a4b926551b69d5a66a
          git -C udhr checkout --detach FETCH_HEAD
          mkdir reports
      - name: Evaluate installed artifacts
        run: |
          python scripts/evaluate_corpus.py evaluate corpus --split holdout --output reports/holdout-native.json
          BYTESENSE_PURE_PYTHON=1 python scripts/evaluate_corpus.py evaluate corpus --split holdout --engine bytesense --output reports/holdout-pure.json
          python scripts/evaluate_udhr.py udhr --output reports/transfer.json
          python scripts/benchmark_v1.py --output reports/latency.json
          python scripts/check_evaluation.py reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: reports/*.json
  wheels:
    uses: ./.github/workflows/wheels.yml
