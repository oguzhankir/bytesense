[build-system]
requires = ["setuptools>=68", "setuptools-rust>=1.12", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bytesense"
version = "1.0.0"
description = "Encoding detection with full-input validation, bounded-memory streams, and optional Rust acceleration."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
  { name = "Oğuzhan Kır", email = "oguzhankir17@gmail.com" },
]
maintainers = [
  { name = "Oğuzhan Kır", email = "oguzhankir17@gmail.com" },
]
keywords = [
  "encoding",
  "charset",
  "detection",
  "unicode",
  "bytes",
  "chardet",
  "charset-normalizer",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Programming Language :: Rust",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Compatibility alias for 0.x installs. Native code is bundled in platform wheels.
fast = []
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "pymdown-extensions>=10.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-benchmark>=4.0",
  "mypy>=1.8",
  "ruff>=0.4",
  "build>=1.2",
  "hypothesis>=6.100; platform_python_implementation != 'PyPy' or python_version >= '3.11'",
  "hypothesis==6.100.0; platform_python_implementation == 'PyPy' and python_version < '3.11'",
  "setuptools-rust>=1.12",
  "charset-normalizer>=3.3",
  "chardet>=5.0",
  "requests>=2.31",
  "certifi>=2023.0",
  "twine>=5.0",
]

[project.scripts]
bytesense = "bytesense.cli:main"

[project.urls]
Homepage    = "https://github.com/oguzhankir/bytesense"
Repository  = "https://github.com/oguzhankir/bytesense"
Issues      = "https://github.com/oguzhankir/bytesense/issues"
Changelog     = "https://github.com/oguzhankir/bytesense/blob/main/CHANGELOG.md"
Documentation = "https://oguzhankir.github.io/bytesense/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bytesense = ["py.typed", "data/*.json.gz"]

[tool.ruff]
line-length    = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.mypy]
# Use the current mypy target; CI also runs Python 3.9.
python_version      = "3.10"
strict              = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "bytesense._rust"
ignore_errors = true

[[tool.mypy.overrides]]
module = "bytesense.fingerprint"
disable_error_code = ["type-arg", "no-any-return"]

[[tool.mypy.overrides]]
module = "bytesense.candidate"
disable_error_code = ["type-arg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
norecursedirs = [".hypothesis", ".git", ".venv", ".ruff_cache", ".mypy_cache", "rust", "dist", "build", "htmlcov"]
addopts   = "-v --tb=short"

[tool.coverage.run]
source = ["bytesense"]
omit = ["*/data/fingerprints.py"]

[tool.coverage.report]
# Total includes large api.py surface; optional Rust tests are often skipped locally.
# Target 75%+ on all CI platforms; add tests for api/heuristics/fingerprint branches before lowering.
fail_under = 75
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "except ImportError",
  "raise NotImplementedError",
  "@overload",
]
